name: Test redis-utils subscription scans

on:
  push:
    branches:
      - codex/redis-utils-subscription-scans
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve modules
        run: go mod download

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "The following Go files are not gofmt-formatted:"
            gofmt -l .
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/api
