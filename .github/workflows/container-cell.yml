name: Container cell

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'deploy/container/**'
      - '.github/workflows/container-cell.yml'
  workflow_dispatch:
    inputs:
      cache-mode:
        description: Nix build cache policy
        type: choice
        options:
          - none
          - volume
        default: none

permissions:
  contents: read

env:
  NIX_CACHE_MODE: ${{ inputs.cache-mode || 'none' }}

jobs:
  build-and-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout nix-alpine builder sidecar
        uses: actions/checkout@v4
        with:
          repository: dash-xd/nix-alpine
          ref: main
          path: .deps/nix-alpine

      - name: Prepare Nix builder image
        uses: dash-xd/nix-alpine@80a2821b7571edd09507f9b4349e2f1ed3daf900
        with:
          image-name: nix-alpine:logma-cell
          cache-key: nix-alpine-logma-cell
          toolbox-path: .deps/nix-alpine

      - name: Restore lightweight Nix cache
        if: env.NIX_CACHE_MODE == 'volume'
        uses: actions/cache/restore@v4
        with:
          path: .nix-cache
          key: logma-nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'go.mod', 'go.sum') }}
          restore-keys: |
            logma-nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Build OCI archive
        shell: bash
        env:
          CACHE_MODE: ${{ env.NIX_CACHE_MODE }}
        run: |
          set -euo pipefail

          docker_args=(
            --rm
            --user root
            -e 'NIX_CONFIG=experimental-features = nix-command flakes
          sandbox = false
          filter-syscalls = false
          build-users-group = nixbld'
            -v "$GITHUB_WORKSPACE:/workspace"
            -w /workspace
          )

          if [[ "$CACHE_MODE" == "volume" ]]; then
            mkdir -p .nix-cache/store .nix-cache/user
            docker_args+=(
              -v "$GITHUB_WORKSPACE/.nix-cache/store:/nix"
              -v "$GITHUB_WORKSPACE/.nix-cache/user:/home/nixuser/.cache/nix"
            )
          fi

          docker run "${docker_args[@]}" nix-alpine:logma-cell \
            bash -lc 'timeout --foreground 8m nix build path:.#image -L'

          cp -L result logma-cell.tar.gz

      - name: Save lightweight Nix cache
        if: env.NIX_CACHE_MODE == 'volume'
        uses: actions/cache/save@v4
        with:
          path: .nix-cache
          key: logma-nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'go.mod', 'go.sum') }}

      - name: Load image
        run: docker load -i logma-cell.tar.gz

      - name: Smoke runtime cell
        shell: bash
        run: |
          set -euo pipefail
          docker volume create logma-cell-redis-socket >/dev/null
          docker run -d \
            --name logma-cell-smoke \
            -e API_KEY=fixture-key \
            -v logma-cell-redis-socket:/run/logma-redis \
            -p 18080:8080 \
            logma-cell:latest
          trap 'docker logs logma-cell-smoke || true; docker rm -f logma-cell-smoke >/dev/null 2>&1 || true; docker volume rm logma-cell-redis-socket >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 100); do
            if curl -fsS -H 'X-API-Key: fixture-key' http://127.0.0.1:18080/channels/ >/tmp/channels.json; then
              break
            fi
            sleep 0.1
          done

          test -s /tmp/channels.json
          docker exec logma-cell-smoke test -S /run/logma-redis/redis.sock
          docker exec logma-cell-smoke redis-cli -s /run/logma-redis/redis.sock ping | grep -qx PONG

          docker run --rm \
            --user 10001:6379 \
            -v logma-cell-redis-socket:/run/logma-redis \
            --entrypoint redis-cli \
            logma-cell:latest \
            -s /run/logma-redis/redis.sock ping | grep -qx PONG

          if docker exec logma-cell-smoke redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; then
            echo "::error::Redis TCP port unexpectedly accepting connections"
            exit 1
          fi

          echo "::notice::nginx -> logma -> shared Redis unix socket smoke passed; non-root sibling container PONG via GID 6379; Redis TCP is disabled"

      - name: Upload OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: logma-cell-${{ github.sha }}
          path: logma-cell.tar.gz
          retention-days: 7
