name: Container cell

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'deploy/container/**'
      - '.github/workflows/container-cell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Nix builder image
        uses: dash-xd/nix-alpine@main
        with:
          image-name: nix-alpine:logma-cell
          cache-key: nix-alpine-logma-cell

      - name: Build OCI archive with cached named Nix volumes
        uses: dash-xd/nix-alpine/volume-cache@main
        with:
          image-name: nix-alpine:logma-cell
          cache-key: logma-cell-${{ hashFiles('flake.nix', 'go.mod', 'go.sum', 'cmd/**/*.go', 'internal/**/*.go') }}
          store-volume: logma-cell-nix-store
          user-cache-volume: logma-cell-nix-user-cache
          command: |
            nix build .#image -L
            cp -L result /workspace/logma-cell.tar.gz

      - name: Load image
        run: docker load -i logma-cell.tar.gz

      - name: Smoke runtime cell
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm             --name logma-cell-smoke             -e API_KEY=fixture-key             -p 18080:8080             logma-cell:latest
          trap 'docker logs logma-cell-smoke || true; docker rm -f logma-cell-smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 100); do
            if curl -fsS -H 'X-API-Key: fixture-key' http://127.0.0.1:18080/channels/ >/tmp/channels.json; then
              break
            fi
            sleep 0.1
          done

          test -s /tmp/channels.json
          docker exec logma-cell-smoke test -S /run/redis/redis.sock

          if docker exec logma-cell-smoke sh -c 'ss -ltn 2>/dev/null | grep -q ":6379 "'; then
            echo "::error::Redis TCP port unexpectedly listening"
            exit 1
          fi

          echo "::notice::nginx -> logma -> Redis unix socket smoke passed"

      - name: Upload OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: logma-cell-${{ github.sha }}
          path: logma-cell.tar.gz
          retention-days: 7
