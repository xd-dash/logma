name: lifecycle-composition

on:
  push:
    branches:
      - lifecycle-policy-retention
      - reconcile-lifecycle-main
      - ratelimiter-policy-v2
    paths:
      - ".github/requests/lifecycle-composition.txt"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Logma
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module graph
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check lifecycle formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find internal/lifecycle -type f -name '*.go' -print0)
          files+=(cmd/api/main.go cmd/api-lifecycle/main.go internal/routes/lifecycle_routes.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'unformatted lifecycle composition files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build canonical API
        run: go build ./cmd/api

      - name: Start Redis 7.2.5
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name logma-lifecycle-redis -p 16379:6379 redis:7.2.5 \
            redis-server --save "" --appendonly no
          for _ in $(seq 1 100); do
            if (echo > /dev/tcp/127.0.0.1/16379) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.05
          done
          docker logs logma-lifecycle-redis >&2 || true
          exit 1

      - name: Start canonical Logma lifecycle runtime
        shell: bash
        env:
          REDIS_URI: 127.0.0.1:16379
          API_KEY: lifecycle-composition-test
          LOGMA_RATELIMITER_BOOTSTRAP: internal
          LOGMA_LIFECYCLE_STATE_DIR: /tmp/logma-lifecycle-state
        run: |
          set -euo pipefail
          rm -rf "$LOGMA_LIFECYCLE_STATE_DIR"
          nohup go run ./cmd/api 18081 >/tmp/logma-lifecycle-composition.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -fsS -H 'X-API-Key: lifecycle-composition-test' http://127.0.0.1:18081/lifecycle/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.1
          done
          cat /tmp/logma-lifecycle-composition.log >&2 || true
          exit 1

      - name: Verify lifecycle API contract
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/lifecycle/policies)"
          test "$status" = "401"
          body="$(curl -fsS -H 'X-API-Key: lifecycle-composition-test' http://127.0.0.1:18081/lifecycle/policies)"
          printf '%s\n' "$body"
          grep -q 'smoke-10m' <<<"$body"
          grep -q '10m0s' <<<"$body"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f logma-lifecycle-redis >/dev/null 2>&1 || true
          rm -rf /tmp/logma-lifecycle-state
