name: Pub/Sub model qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pubsubmodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          diff="$(gofmt -d internal/pubsubmodel)"
          if [ -n "$diff" ]; then
            printf 'gofmt diff:\n%s\n' "$diff"
            exit 1
          fi

      - name: Vet Pub/Sub model
        run: go vet ./internal/pubsubmodel

      - name: Test Pub/Sub model
        run: go test ./internal/pubsubmodel

      - name: Build API
        run: go build ./cmd/api
