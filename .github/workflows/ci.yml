name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          failed=0
          for file in internal/pubsubmodel/*.go; do
            diff="$(gofmt -d "$file")"
            if [ -n "$diff" ]; then
              printf 'gofmt diff for %s:\n%s\n' "$file" "$diff"
              failed=1
            fi
          done
          exit "$failed"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/api
