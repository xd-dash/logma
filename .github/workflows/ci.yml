name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t go_files < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD -- '*.go')
          if (( ${#go_files[@]} == 0 )); then
            exit 0
          fi
          mapfile -t unformatted < <(gofmt -l "${go_files[@]}")
          if (( ${#unformatted[@]} != 0 )); then
            printf 'gofmt required:\n'
            printf '  %s\n' "${unformatted[@]}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/api
