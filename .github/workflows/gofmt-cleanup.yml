name: Gofmt cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Format remaining pre-existing files
        run: |
          gofmt -w \
            serverless/pubsub/lifecycle_policy.go \
            serverless/pubsub/runtime_registry.go \
            serverless/pubsub/service.go

          if git diff --quiet -- \
            serverless/pubsub/lifecycle_policy.go \
            serverless/pubsub/runtime_registry.go \
            serverless/pubsub/service.go; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            serverless/pubsub/lifecycle_policy.go \
            serverless/pubsub/runtime_registry.go \
            serverless/pubsub/service.go
          git commit -m "gofmt remaining serverless files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
