name: Test Logma with Marai

on:
  push:
    branches:
      - automation
    paths:
      - .github/automation/marai-logma-test.json

permissions:
  contents: read

concurrency:
  group: logma-marai-integration
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      logma_branch: ${{ steps.request.outputs.logma_branch }}
      marai_branch: ${{ steps.request.outputs.marai_branch }}
      run_standalone_main: ${{ steps.request.outputs.run_standalone_main }}
      redis_image: ${{ steps.request.outputs.redis_image }}
      secret_db_count: ${{ steps.request.outputs.secret_db_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation
          sparse-checkout: |
            .github/automation/marai-logma-test.json
          sparse-checkout-cone-mode: false

      - name: Parse request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=.github/automation/marai-logma-test.json

          logma_branch="$(jq -er '.logma_branch' "$file")"
          marai_branch="$(jq -er '.marai_branch' "$file")"
          run_standalone_main="$(jq -er '.run_standalone_main // true' "$file")"
          redis_image="$(jq -er '.redis_image // "redis:8-alpine"' "$file")"
          secret_db_count="$(jq -er '.marai_secret_db_count // 8' "$file")"

          [[ "$secret_db_count" =~ ^[0-9]+$ ]]
          (( secret_db_count >= 1 && secret_db_count <= 12 ))

          {
            echo "logma_branch=$logma_branch"
            echo "marai_branch=$marai_branch"
            echo "run_standalone_main=$run_standalone_main"
            echo "redis_image=$redis_image"
            echo "secret_db_count=$secret_db_count"
          } >> "$GITHUB_OUTPUT"

  standalone-main:
    needs: request
    if: needs.request.outputs.run_standalone_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Logma main
        uses: actions/checkout@v4
        with:
          ref: main
          path: logma-main

      - name: Unit test and build standalone main
        shell: bash
        run: |
          set -euo pipefail
          cd logma-main
          go test ./...
          go build -o "$RUNNER_TEMP/logma-main" ./cmd/api

      - name: Start ordinary Redis
        shell: bash
        env:
          REDIS_IMAGE: ${{ needs.request.outputs.redis_image }}
        run: |
          set -euo pipefail
          docker run -d --name logma-standalone-redis             -p 16380:6379 "$REDIS_IMAGE"

          for _ in $(seq 1 50); do
            if docker exec logma-standalone-redis redis-cli PING | grep -q PONG; then
              exit 0
            fi
            sleep 0.2
          done
          docker logs logma-standalone-redis >&2
          exit 1

      - name: Start callback receiver
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/standalone-callback.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          out = Path("/tmp/logma-standalone-callback")

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  out.write_bytes(self.rfile.read(length))
                  self.send_response(204)
                  self.end_headers()

              def log_message(self, fmt, *args):
                  pass

          HTTPServer(("127.0.0.1", 18083), Handler).serve_forever()
          PY

          python3 "$RUNNER_TEMP/standalone-callback.py"             >"$RUNNER_TEMP/standalone-callback.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/standalone-callback.pid"

      - name: Exercise main against stock Redis
        shell: bash
        run: |
          set -euo pipefail

          env             API_KEY=standalone-api-key             REDIS_URI=127.0.0.1:16380             REDIS_DB=0             "$RUNNER_TEMP/logma-main" 18082             >"$RUNNER_TEMP/logma-main.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/logma-main.pid"

          for _ in $(seq 1 100); do
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'X-API-Key: standalone-api-key'               http://127.0.0.1:18082/not-found || true)"
            [ "$code" = "404" ] && break
            sleep 0.2
          done

          response="$(curl -fsS             -H 'X-API-Key: standalone-api-key'             -H 'Content-Type: application/json'             -d '{"callbackURL":"http://127.0.0.1:18083/callback"}'             http://127.0.0.1:18082/channels/dev:global:logs:standalone/subscribe)"
          jq -e '.subscriptionID != ""' <<<"$response" >/dev/null

          group_id="$(curl -fsS             -X POST             -H 'X-API-Key: standalone-api-key'             http://127.0.0.1:18082/channels/groups/save)"
          test -n "$group_id"

          docker exec logma-standalone-redis redis-cli             PUBLISH dev:global:logs:standalone             '{"type":"Log","sentTimeUtc":"now","message":{"standalone":true},"parentNamespace":"dev","childNamespace":"global","channel":"logs:standalone"}'             >/dev/null

          for _ in $(seq 1 50); do
            [ -f /tmp/logma-standalone-callback ] && break
            sleep 0.2
          done
          test -f /tmp/logma-standalone-callback

          keys="$(docker exec logma-standalone-redis redis-cli --raw KEYS '*')"
          grep -q '^active_subscriptions:' <<<"$keys"
          grep -q '^subscription_groups:' <<<"$keys"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in             "$RUNNER_TEMP/logma-main.pid"             "$RUNNER_TEMP/standalone-callback.pid"; do
            [ -f "$pidfile" ] && kill -TERM "$(cat "$pidfile")" 2>/dev/null
          done
          docker rm -f logma-standalone-redis >/dev/null 2>&1

  marai-integration:
    needs: request
    runs-on: ubuntu-latest
    steps:
      - name: Mint scoped GitHub App token
        id: app-token
        if: >-
          ${{
            (vars.CI_APP_ID != '' || secrets.CI_APP_ID != '') &&
            secrets.CI_APP_PRIVATE_KEY != ''
          }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID || secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: xd-dash
          repositories: |
            logma
            marai

      - name: Require cross-repo credential
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.XD_DASH_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ] && [ -z "$FALLBACK_TOKEN" ]; then
            echo "No credential can read private xd-dash/marai." >&2
            echo "Configure CI_APP_ID + CI_APP_PRIVATE_KEY (preferred)," >&2
            echo "or XD_DASH_REPO_READ_TOKEN as a fallback." >&2
            exit 1
          fi

      - name: Checkout Logma test branch
        uses: actions/checkout@v4
        with:
          repository: xd-dash/logma
          ref: ${{ needs.request.outputs.logma_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.XD_DASH_REPO_READ_TOKEN }}
          path: work/logma
          persist-credentials: false

      - name: Checkout Marai test branch
        uses: actions/checkout@v4
        with:
          repository: xd-dash/marai
          ref: ${{ needs.request.outputs.marai_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.XD_DASH_REPO_READ_TOKEN }}
          path: work/marai
          persist-credentials: false

      - name: Test and build selected Logma branch
        shell: bash
        run: |
          set -euo pipefail
          cd work/logma
          go test ./...
          go build -o "$RUNNER_TEMP/logma-marai" ./cmd/api

      - name: Run Marai production-image integration suite
        shell: bash
        run: |
          set -euo pipefail
          cd work/marai
          MARAI_IMAGE_TAG=marai-logma-integration:test             MARAI_TEST_PORT=16379             test/run_docker.sh

      - name: Start Marai with managed ACL
        shell: bash
        env:
          SECRET_DB_COUNT: ${{ needs.request.outputs.secret_db_count }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/marai-secrets"
          printf '%s\n' 'integration-admin-password-000000000000000001' > "$RUNNER_TEMP/marai-secrets/admin"
          printf '%s\n' 'integration-app-password-0000000000000000001' > "$RUNNER_TEMP/marai-secrets/app"
          printf '%s\n' 'integration-logma-password-00000000000000001' > "$RUNNER_TEMP/marai-secrets/logma"
          printf '%s\n' 'dev:global:logs:*' > "$RUNNER_TEMP/marai-secrets/channels"
          chmod 0444 "$RUNNER_TEMP/marai-secrets"/*

          docker run -d --name marai-logma-test             -p 16379:6379             -v "$RUNNER_TEMP/marai-secrets:/run/test-secrets:ro"             -e MARAI_ADMIN_PASSWORD_FILE=/run/test-secrets/admin             -e MARAI_APP_PASSWORD_FILE=/run/test-secrets/app             -e MARAI_SECRET_DB_COUNT="$SECRET_DB_COUNT"             marai-logma-integration:test

          for _ in $(seq 1 100); do
            if docker exec               -e REDISCLI_AUTH='integration-admin-password-000000000000000001'               marai-logma-test               redis-cli --user marai-admin FUNCTION LIST 2>/dev/null | grep -q selfkms; then
              exit 0
            fi
            sleep 0.2
          done

          docker logs marai-logma-test >&2
          exit 1

      - name: Bootstrap Logma ACL and KMS key
        shell: bash
        run: |
          set -euo pipefail

          docker exec             -e REDISCLI_AUTH='integration-admin-password-000000000000000001'             marai-logma-test             redis-cli --user marai-admin             FCALL kms_create_key 0 logma >/dev/null

          docker exec             -e MARAI_CURRENT_ADMIN_PASSWORD_FILE=/run/test-secrets/admin             -e MARAI_LOGMA_PASSWORD_FILE=/run/test-secrets/logma             -e MARAI_LOGMA_CHANNEL_PATTERNS_FILE=/run/test-secrets/channels             -e MARAI_LOGMA_CONNECTION_DB=1             marai-logma-test             marai-apply-logma-acl -p 6379

      - name: Start callback receiver
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/callback.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          out = Path("/tmp/logma-callback")

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  out.write_bytes(
                      self.headers.get("Authorization", "").encode()
                      + b"\n"
                      + body
                  )
                  self.send_response(204)
                  self.end_headers()

              def log_message(self, fmt, *args):
                  pass

          HTTPServer(("127.0.0.1", 18081), Handler).serve_forever()
          PY

          python3 "$RUNNER_TEMP/callback.py" >"$RUNNER_TEMP/callback.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/callback.pid"

      - name: Start Marai-backed Logma
        shell: bash
        run: |
          set -euo pipefail

          env             API_KEY=integration-api-key             REDIS_URI=127.0.0.1:16379             REDIS_USERNAME=marai-logma             REDISCLI_AUTH='integration-logma-password-00000000000000001'             REDIS_DB=1             MARAI_CACHE_DB=1             MARAI_KMS_KEY_ID=logma             MARAI_CACHE_NAMESPACE=logma             "$RUNNER_TEMP/logma-marai" 18080             >"$RUNNER_TEMP/logma-marai.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/logma-marai.pid"

          for _ in $(seq 1 100); do
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'X-API-Key: integration-api-key'               http://127.0.0.1:18080/not-found || true)"
            [ "$code" = "404" ] && exit 0
            sleep 0.2
          done

          cat "$RUNNER_TEMP/logma-marai.log" >&2
          exit 1

      - name: Exercise encrypted subscription state
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl -fsS             -H 'X-API-Key: integration-api-key'             -H 'Content-Type: application/json'             -d '{
              "callbackURL":"http://127.0.0.1:18081/callback",
              "accessToken":"short-lived-test-token",
              "tokenScheme":"Bearer"
            }'             http://127.0.0.1:18080/channels/dev:global:logs:test/subscribe)"

          subscription_id="$(jq -er '.subscriptionID' <<<"$response")"

          group_id="$(curl -fsS             -X POST             -H 'X-API-Key: integration-api-key'             http://127.0.0.1:18080/channels/groups/save)"
          test -n "$group_id"

          db0_size="$(
            docker exec               -e REDISCLI_AUTH='integration-admin-password-000000000000000001'               marai-logma-test               redis-cli --user marai-admin -n 0 DBSIZE
          )"
          test "$db0_size" = "0"

          key="__marai_cache:logma:active:$subscription_id"

          docker exec             -e REDISCLI_AUTH='integration-admin-password-000000000000000001'             marai-logma-test             redis-cli --raw --user marai-admin -n 1 GET "$key"             | xxd -p -l 4             | grep -Fx '4d524331'

          if docker exec             -e REDISCLI_AUTH='integration-admin-password-000000000000000001'             marai-logma-test             redis-cli --raw --user marai-admin -n 1 GET "$key"             | grep -aFq 'http://127.0.0.1:18081/callback'; then
            echo "callback URL leaked into stored value" >&2
            exit 1
          fi

          if docker exec             -e REDISCLI_AUTH='integration-admin-password-000000000000000001'             marai-logma-test             redis-cli --raw --user marai-admin -n 1 GET "$key"             | grep -aFq 'short-lived-test-token'; then
            echo "callback token leaked into stored value" >&2
            exit 1
          fi

          for command in 'GET anything' 'SCAN 0' 'SELECT 0'; do
            output="$(
              docker exec                 -e REDISCLI_AUTH='integration-logma-password-00000000000000001'                 marai-logma-test                 sh -c "redis-cli --user marai-logma $command" 2>&1 || true
            )"
            grep -q NOPERM <<<"$output" || {
              echo "marai-logma unexpectedly allowed: $command" >&2
              echo "$output" >&2
              exit 1
            }
          done

          docker exec             -e REDISCLI_AUTH='integration-logma-password-00000000000000001'             marai-logma-test             redis-cli --user marai-logma             PUBLISH dev:global:logs:test             '{"type":"Log","sentTimeUtc":"now","message":{"ok":true},"parentNamespace":"dev","childNamespace":"global","channel":"logs:test"}'             >/dev/null

          for _ in $(seq 1 50); do
            [ -f /tmp/logma-callback ] && break
            sleep 0.2
          done

          test -f /tmp/logma-callback
          head -n1 /tmp/logma-callback             | grep -Fx 'Bearer short-lived-test-token'

          printf '%s' "$group_id" > "$RUNNER_TEMP/group-id"

      - name: Verify encrypted group restore
        shell: bash
        run: |
          set -euo pipefail

          kill -TERM "$(cat "$RUNNER_TEMP/logma-marai.pid")"
          for _ in $(seq 1 50); do
            kill -0 "$(cat "$RUNNER_TEMP/logma-marai.pid")" 2>/dev/null || break
            sleep 0.1
          done

          rm -f /tmp/logma-callback

          env             API_KEY=integration-api-key             REDIS_URI=127.0.0.1:16379             REDIS_USERNAME=marai-logma             REDISCLI_AUTH='integration-logma-password-00000000000000001'             REDIS_DB=1             MARAI_CACHE_DB=1             MARAI_KMS_KEY_ID=logma             MARAI_CACHE_NAMESPACE=logma             "$RUNNER_TEMP/logma-marai" 18080             >"$RUNNER_TEMP/logma-marai-restore.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/logma-marai.pid"

          for _ in $(seq 1 100); do
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'X-API-Key: integration-api-key'               http://127.0.0.1:18080/not-found || true)"
            [ "$code" = "404" ] && break
            sleep 0.2
          done

          group_id="$(cat "$RUNNER_TEMP/group-id")"

          curl -fsS             -H 'X-API-Key: integration-api-key'             "http://127.0.0.1:18080/channels/groups/load/$group_id"             | jq -e '.subscriptions >= 1' >/dev/null

          docker exec             -e REDISCLI_AUTH='integration-logma-password-00000000000000001'             marai-logma-test             redis-cli --user marai-logma             PUBLISH dev:global:logs:test             '{"type":"Log","sentTimeUtc":"now","message":{"restored":true},"parentNamespace":"dev","childNamespace":"global","channel":"logs:test"}'             >/dev/null

          for _ in $(seq 1 50); do
            [ -f /tmp/logma-callback ] && break
            sleep 0.2
          done

          test -f /tmp/logma-callback
          head -n1 /tmp/logma-callback             | grep -Fx 'Bearer short-lived-test-token'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in             "$RUNNER_TEMP/logma-marai.pid"             "$RUNNER_TEMP/callback.pid"; do
            [ -f "$pidfile" ] && kill -TERM "$(cat "$pidfile")" 2>/dev/null
          done
          docker rm -f marai-logma-test >/dev/null 2>&1
