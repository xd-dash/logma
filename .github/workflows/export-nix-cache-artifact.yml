name: Export Nix cache artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/nix-cache-export/request.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest Logma Nix volume cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .nix-volume-cache
          key: nix-artifact-export-${{ github.run_id }}
          restore-keys: |
            volumes-v3-${{ runner.os }}-${{ runner.arch }}-logma-cell-

      - name: Validate restored cache
        run: |
          set -euo pipefail
          test -s .nix-volume-cache/nix-store.tar.gz
          test -s .nix-volume-cache/nix-user-cache.tar.gz
          jq -n \
            --arg artifact_name 'nix-volume-cache-logma-cell' \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" \
            '{schema:1,artifact_name:$artifact_name,source_repo:$source_repo,source_sha:$source_sha,source_run_id:$source_run_id,cache_key:"restored-prefix"}' \
            > .nix-volume-cache/manifest.json

      - name: Upload transferable Nix cache
        uses: actions/upload-artifact@v4
        with:
          name: nix-volume-cache-logma-cell
          path: .nix-volume-cache/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
