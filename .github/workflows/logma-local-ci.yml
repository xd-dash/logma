name: Logma Local Redis CI

on:
  push:
    branches:
      - automation
    paths:
      - .github/automation/logma-local-test.json

permissions:
  contents: read

concurrency:
  group: logma-local-redis-ci
  cancel-in-progress: false

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation input
        uses: actions/checkout@v4
        with:
          ref: automation
          sparse-checkout: |
            .github/automation/logma-local-test.json
          sparse-checkout-cone-mode: false

      - name: Parse request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=.github/automation/logma-local-test.json
          echo "logma_branch=$(jq -er '.logma_branch // "main"' "$file")" >> "$GITHUB_OUTPUT"
          echo "sus_redis_ref=$(jq -er '.sus_redis_ref // "main"' "$file")" >> "$GITHUB_OUTPUT"

      - name: Checkout Logma
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.logma_branch }}
          path: work/logma
          persist-credentials: false

      - name: Test and build Logma
        shell: bash
        run: |
          set -euo pipefail
          cd work/logma
          go test ./...
          go build -o "$RUNNER_TEMP/logma" ./cmd/api

      - name: Install sus-redis fixture
        env:
          SUS_REDIS_REF: ${{ steps.request.outputs.sus_redis_ref }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/redis-server.tar.gz"
          out="$RUNNER_TEMP/sus-redis"
          mkdir -p "$out"

          curl -fsSL             "https://raw.githubusercontent.com/xd-dash/sus-redis/${SUS_REDIS_REF}/redis-server.tar.gz"             -o "$archive"
          tar -xzf "$archive" -C "$out"

          server="$(find "$out" -type f -name redis-server -print -quit)"
          if [ -z "$server" ]; then
            echo "sus-redis archive did not contain redis-server" >&2
            find "$out" -maxdepth 3 -type f -print >&2
            exit 1
          fi
          chmod +x "$server"
          echo "server=$server" >> "$GITHUB_ENV"

      - name: Start sus-redis
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/redis.conf" <<'EOF'
          bind 127.0.0.1
          protected-mode no
          port 16380
          save ""
          appendonly no
          daemonize no
          EOF

          "$server" "$RUNNER_TEMP/redis.conf" >"$RUNNER_TEMP/redis.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/redis.pid"

          python3 - <<'PY'
          import socket, time
          for _ in range(100):
              try:
                  with socket.create_connection(("127.0.0.1", 16380), timeout=.2) as s:
                      s.sendall(b"*1\r\n$4\r\nPING\r\n")
                      if b"PONG" in s.recv(128):
                          raise SystemExit(0)
              except OSError:
                  pass
              time.sleep(.1)
          raise SystemExit("sus-redis did not become ready")
          PY

      - name: Start callback receiver
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/callback.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          out = Path("/tmp/logma-local-callback")

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  out.write_bytes(self.rfile.read(n))
                  self.send_response(204)
                  self.end_headers()
              def log_message(self, fmt, *args):
                  pass

          HTTPServer(("127.0.0.1", 18083), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/callback.py" >"$RUNNER_TEMP/callback.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/callback.pid"

      - name: Exercise standalone Logma
        shell: bash
        run: |
          set -euo pipefail

          env             API_KEY=standalone-api-key             REDIS_URI=127.0.0.1:16380             REDIS_DB=0             "$RUNNER_TEMP/logma" 18082             >"$RUNNER_TEMP/logma.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/logma.pid"

          for _ in $(seq 1 100); do
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'X-API-Key: standalone-api-key'               http://127.0.0.1:18082/not-found || true)"
            [ "$code" = "404" ] && break
            sleep .1
          done

          response="$(curl -fsS             -H 'X-API-Key: standalone-api-key'             -H 'Content-Type: application/json'             -d '{"callbackURL":"http://127.0.0.1:18083/callback"}'             http://127.0.0.1:18082/channels/dev:global:logs:standalone/subscribe)"
          jq -e '.subscriptionID != ""' <<<"$response" >/dev/null

          curl -fsS -X POST             -H 'X-API-Key: standalone-api-key'             http://127.0.0.1:18082/channels/groups/save             >/dev/null

          python3 - <<'PY'
          import socket
          parts = [
              b"PUBLISH",
              b"dev:global:logs:standalone",
              b'{"type":"Log","sentTimeUtc":"now","message":{"standalone":true},"parentNamespace":"dev","childNamespace":"global","channel":"logs:standalone"}',
          ]
          req = b"*" + str(len(parts)).encode() + b"\r\n"
          for p in parts:
              req += b"$" + str(len(p)).encode() + b"\r\n" + p + b"\r\n"
          with socket.create_connection(("127.0.0.1", 16380)) as s:
              s.sendall(req)
              s.recv(256)
          PY

          for _ in $(seq 1 50); do
            [ -f /tmp/logma-local-callback ] && break
            sleep .1
          done
          test -f /tmp/logma-local-callback

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          for f in "$RUNNER_TEMP/logma.pid" "$RUNNER_TEMP/redis.pid" "$RUNNER_TEMP/callback.pid"; do
            [ -f "$f" ] && kill -TERM "$(cat "$f")" 2>/dev/null
          done
