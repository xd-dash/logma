name: Fetch logma
description: Restores the cached logma binary (built by the build-logma action) and copies it into the working directory.
inputs:
  destination:
    description: Directory to copy the logma binary into.
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - id: cache-key
      shell: bash
      run: |
        echo "key=logma-bin-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum', 'go.mod') }}" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: /usr/local/bin/logma
        key: ${{ steps.cache-key.outputs.key }}

    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::error::No cached logma binary found for key '${{ steps.cache-key.outputs.key }}'. Run the build-logma action first." >&2
        exit 1

    - shell: bash
      run: |
        mkdir -p "${{ inputs.destination }}"
        cp /usr/local/bin/logma "${{ inputs.destination }}/logma"
        chmod +x "${{ inputs.destination }}/logma"
